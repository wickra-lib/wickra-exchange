# CodeQL analysis configuration, referenced from .github/workflows/codeql.yml.
#
# The rule for adding to this list: a path belongs here when a generator owns
# the file end to end and stamps it as such, never because a finding in it was
# inconvenient.
#
# `bindings/node/index.js` and `index.d.ts` are written by `napi build` from the
# Rust source and committed so consumers get types without a build step. Neither
# is edited by hand, and a finding in either points at the generator rather than
# at anything a reader can act on.
#
# `bindings/node/src/lib.rs` was left in when this file was written, on the
# argument that it is hand-written here rather than generated as in wickra, so
# excluding it would drop real code to silence a few false positives. The first
# runs settled that, and the argument does not survive them:
#
#   * Five `rust/access-invalid-pointer` alerts, one per exported `#[napi]`
#     class, each anchored on a `pub struct` line -- not on a pointer
#     expression.
#   * The file contains **zero** `unsafe`. The dereference the rule sees is
#     inside napi-derive's expansion, which CodeQL attributes back to the
#     macro's source span.
#
# So the rule cannot truthfully say anything about this file, and the count grows
# by one with every class added. Excluding it drops nothing that rule could find.
#
# It is excluded by path rather than by disabling the query: `query-filters`
# matches on id, tags and severity and cannot be scoped to a path, so switching
# the rule off would also switch it off for `bindings/c/src`, which is where this
# workspace's real raw-pointer code lives and where the rule earns its place.
#
# The C#, Java, Go and R bindings stay in: this repository has no code generator,
# so there are no `.g.cs` or generated `org/wickra/*.java` files to exclude --
# every one of those files is hand-written and belongs in the database.
paths-ignore:
  - bindings/node/src/lib.rs
  - bindings/node/index.js
  - bindings/node/index.d.ts
