name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keyed on the workflow as well as the ref, so a push to a branch does not
  # cancel a different workflow's run on the same ref. Runs on main are never
  # cancelled: main is the baseline every later comparison is made against.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The PyO3 extension cdylib is built and tested by the `python` job via
      # maturin (which supplies the platform link flags); exclude it here.
      - run: cargo build --workspace --all-features --exclude wickra-exchange-python
      - run: cargo test --workspace --all-features --exclude wickra-exchange-python

  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV workspace (1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The Node binding (napi 3) requires Rust 1.88 and is checked separately
      # below; the Python binding needs maturin's platform link flags and is
      # built by the `python` job.
      - run: cargo build --workspace --exclude wickra-exchange-python --exclude wickra-exchange-node

  msrv-node:
    name: MSRV node binding (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p wickra-exchange-node

  binding-surface:
    name: Binding surface parity
    runs-on: ubuntu-latest
    timeout-minutes: 10 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each binding is written separately and tested separately, so a method
      # missing from one of them fails nowhere -- nothing compared the bindings
      # to each other. The first run of this found that the R binding had no
      # `wkex_connect`: an R user could open the derivatives and user-data
      # handles against a live venue and never construct a plain exchange.
      - name: Compare every binding's surface with the Rust traits
        run: python3 scripts/check_binding_surface.py

      # The version lives in twenty-odd declarations across six package
      # managers. A bump that misses one ships a package pinning a binary that
      # was never published, and that surfaces on a user's machine after the
      # tag, which is irreversible.
      - name: Every version declaration agrees
        run: python3 scripts/check_version_sync.py

      # Each bindings/*/README.md is, or is a workflow line away from being, a
      # published package's long description: PyPI renders the Python one, NuGet
      # the C# one, pkg.go.dev the Go one. A link that leaves the package is
      # dead there while resolving fine on GitHub, so nothing says so.
      - name: Binding READMEs link only to what travels with them
        run: python3 scripts/check_readme_links.py

      # An SPDX expression in a manifest is a reference to two documents, not
      # the documents. cargo decides what to package from git, so the copies
      # have to be committed -- and committed copies drift.
      - name: Every published package carries its licence texts
        run: python3 scripts/check_license_copies.py

      # src/Makevars takes the header and library from WKEX_INC / WKEX_LIB,
      # supplied from outside, so nothing in the R job proves the wrapper's
      # calls match the header it is handed -- CI points both at the tree, where
      # they agree by construction.
      - name: The R wrapper matches the C ABI in this tree
        run: python3 scripts/check_r_abi_skew.py

  supply-chain:
    name: Supply-chain (cargo-deny + osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      # osv-scanner.toml existed and nothing ran it. A waiver recorded there was
      # load-bearing for nobody, because no workflow ever consulted the file --
      # it only had an effect if OpenSSF Scorecard happened to read it out of
      # band.
      #
      # cargo-deny above covers the Rust graph only. This covers the other six
      # ecosystems -- npm, PyPI, Maven, NuGet, Go modules, R -- which had no
      # vulnerability scanning in CI at all.
      #
      # --no-resolve turns off transitive resolution of *manifests*. The default
      # enricher resolves each pom.xml against Maven Central, and org.wickra
      # artefacts do not exist there until a release publishes them -- so a
      # version bump would make this job fail on a lookup for the very artefact
      # the bump exists to create. A check that goes red for a reason other than
      # the one it checks teaches people to ignore it. Nothing is lost: every
      # lockfile -- Cargo.lock, package-lock.json, go.mod -- is still scanned in
      # full and transitively, because a lockfile needs no resolution.
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            --no-resolve
            --config=osv-scanner.toml
            ./

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Hash-pinned rather than `pip install maturin pytest`: an unpinned
      # install resolves whatever the index serves that minute, so a CI run can
      # differ from the one before it for reasons nothing records. Locked twice
      # because a lock is resolved against one interpreter version and 3.9 is at
      # the end of its life. Regenerate with scripts/update-lockfiles.sh.
      - name: Install pinned Python tooling
        shell: bash
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py39.txt
          else
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py3.txt
          fi
      - run: maturin build --out dist
        working-directory: bindings/python
      - run: pip install --no-index --find-links bindings/python/dist wickra-exchange
      - run: pytest bindings/python/tests -q

  go:
    name: Go on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The binding links against the C ABI hub via cgo; build it first and stage
      # the platform library under bindings/go/lib so cgo's LDFLAGS find it.
      - name: Build the C ABI library
        run: cargo build -p wickra-exchange-c --release

      - name: Vendored header in sync with the C ABI
        shell: bash
        # bindings/go/include/wickra_exchange.h is a committed copy of the C ABI
        # header (the parent ../c/include is outside the Go module, so it must be
        # vendored). Fail if it drifts from the source of truth.
        run: |
          if ! diff -u bindings/c/include/wickra_exchange.h bindings/go/include/wickra_exchange.h; then
            echo "::error::bindings/go/include/wickra_exchange.h is stale — copy bindings/c/include/wickra_exchange.h over it"
            exit 1
          fi

      - name: Stage the native library
        shell: bash
        # Stage into lib/<goos>_<goarch>/ to match the per-platform cgo LDFLAGS.
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::unsupported RUNNER_ARCH '$RUNNER_ARCH'"; exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux)   dir="linux_$arch";   lib=target/release/libwickra_exchange.so ;;
            macOS)   dir="darwin_$arch";  lib=target/release/libwickra_exchange.dylib ;;
            Windows) dir="windows_$arch"; lib=target/release/wickra_exchange.dll ;;
          esac
          mkdir -p "bindings/go/lib/$dir"
          cp "$lib" "bindings/go/lib/$dir/"
          echo "WICKRA_GO_LIBDIR=$PWD/bindings/go/lib/$dir" >> "$GITHUB_ENV"

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l bindings/go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet and test the Go binding
        shell: bash
        # On Windows there is no rpath; the loader resolves wickra_exchange.dll via
        # PATH (WICKRA_GO_LIBDIR is the per-platform staged lib dir). Linux/macOS
        # use the rpath baked by the per-platform cgo LDFLAGS.
        run: |
          export PATH="$WICKRA_GO_LIBDIR:$PATH"
          cd bindings/go
          go vet ./...
          go test ./...

  node:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      # npm install (not npm ci): the per-platform optionalDependencies point at
      # native packages that are not published until the first release, so they
      # are absent from the lock file and `npm ci` would reject the tree as out
      # of sync. install treats the missing optional packages as non-fatal.
      - name: Install Node dependencies
        run: cd bindings/node && npm install --no-audit --no-fund
      # --platform puts the target triple into the filename so the loader finds
      # the freshly built binary instead of a per-platform npm subpackage.
      - name: Build native module
        run: cd bindings/node && npx napi build --platform --release
      - name: Run Node tests
        run: cd bindings/node && node --test

  c-abi:
    name: C ABI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cbindgen
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cbindgen
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-exchange-c --release
      - name: Rust unit tests
        run: cargo test -p wickra-exchange-c
      # The generated header is platform-independent, so checking drift on one OS
      # is enough — and avoids a spurious CRLF/LF diff on the Windows runner.
      - name: Check the committed header is in sync with cbindgen
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cbindgen --config bindings/c/cbindgen.toml --crate wickra-exchange-c --output bindings/c/include/wickra_exchange.h
          if ! git diff --quiet -- bindings/c/include/wickra_exchange.h; then
            echo "::error::bindings/c/include/wickra_exchange.h is out of sync — run cbindgen and commit the result"
            git --no-pager diff -- bindings/c/include/wickra_exchange.h
            exit 1
          fi
      # The real cross-language test: a foreign C consumer links the generated
      # header + the compiled library and runs. If this passes on all three OSes,
      # every C-capable language can link the same way.
      - name: Build and run the C example (CMake + ctest)
        shell: bash
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release
          ctest --test-dir examples/c/build -C Release --output-on-failure

  csharp:
    name: C# on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0"
      # The test project copies the native library next to the test assembly from
      # target/debug (see the <Content> items in the .csproj), so build it in the
      # debug profile here.
      - name: Build the C ABI library
        run: cargo build -p wickra-exchange-c
      - name: Test the C# binding
        run: dotnet test bindings/csharp/WickraExchange.Tests/WickraExchange.Tests.csproj -c Release

  java:
    name: Java on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The binding loads the C ABI hub via the Java FFM API; the pom points
      # java.library.path at target/debug (the <native.lib.dir> property), so
      # build it in the debug profile here. The pom pins bytecode to release 25.
      - name: Build the C ABI library
        run: cargo build -p wickra-exchange-c
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Java info
        run: java -version
      - name: Test the Java binding
        run: mvn -B -f bindings/java test

  r:
    name: R on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    env:
      WKEX_INC: ${{ github.workspace }}/bindings/c/include
      WKEX_LIB: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The package compiles a thin .Call glue layer against the C ABI hub and
      # links -lwickra_exchange from WKEX_LIB; build the library first.
      - name: Build the C ABI library
        run: cargo build -p wickra-exchange-c --release
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install and test the R binding
        shell: bash
        # github.workspace is a backslash path on Windows; Makevars(.win) (sh) and
        # mingw need forward slashes. The Makevars do not bake an rpath, so the
        # native library must be on the loader path at run time: LD_LIBRARY_PATH
        # (Linux), DYLD_LIBRARY_PATH (macOS) and PATH (Windows).
        run: |
          export WKEX_INC="${WKEX_INC//\\//}"
          export WKEX_LIB="${WKEX_LIB//\\//}"
          if command -v cygpath >/dev/null 2>&1; then
            # Windows (rtools bash): add the lib dir to PATH in msys form so the
            # ':' in the drive letter is not parsed as a PATH separator and msys
            # translates it to the Windows PATH the DLL loader searches.
            msys_lib=$(cygpath -u "$WKEX_LIB")
            export PATH="$msys_lib:$PATH"
          else
            export LD_LIBRARY_PATH="$WKEX_LIB:$LD_LIBRARY_PATH"
            export DYLD_LIBRARY_PATH="$WKEX_LIB:$DYLD_LIBRARY_PATH"
          fi
          R CMD INSTALL bindings/r
          Rscript bindings/r/tests/run_tests.R

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (lcov)
        # Only the core is measured: the facade crate holds the thin real-socket
        # transport adapters, which are exercised by gated integration tests, not
        # the offline unit suite.
        run: >
          cargo llvm-cov --all-features
          -p wickra-exchange-core
          --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # An organization-level upload token carries no repository identity,
          # so Codecov cannot route the upload without an explicit slug and
          # falls back to a tokenless upload, which a protected branch rejects.
          slug: ${{ github.repository }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-fuzz
      - name: Fuzz response_parse (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu response_parse -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz credentials_parse (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu credentials_parse -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz filter_round (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu filter_round -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz ws_frame (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ws_frame -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz orderbook_diff (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu orderbook_diff -- -max_total_time=30
        working-directory: fuzz
