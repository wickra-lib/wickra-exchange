name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keyed on the workflow as well as the ref, so a push to a branch does not
  # cancel a different workflow's run on the same ref. Runs on main are never
  # cancelled: main is the baseline every later comparison is made against.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The PyO3 extension cdylib is built and tested by the `python` job via
      # maturin (which supplies the platform link flags); exclude it here.
      - run: cargo build --workspace --all-features --exclude wickra-exchange-python
      - run: cargo test --workspace --all-features --exclude wickra-exchange-python

  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV workspace (1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The Node binding (napi 3) requires Rust 1.88 and is checked separately
      # below; the Python binding needs maturin's platform link flags and is
      # built by the `python` job.
      - run: cargo build --workspace --exclude wickra-exchange-python --exclude wickra-exchange-node

  msrv-node:
    name: MSRV node binding (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p wickra-exchange-node

  # links.yml is the authoritative check and runs weekly; this is the early
  # heads-up on the pull request that introduces a dead link. Non-blocking on
  # purpose: external link rot is somebody else's outage, and a third-party site
  # rate-limiting must not turn a green change red. links.yml's header has
  # described this job since the repository was seeded -- it just did not exist.
  links:
    name: External links (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}" "*.md" "bindings/*/README.md"
          fail: true

  # Every example, compiled or parsed.
  #
  # Only examples/c was ever built (by the c-abi job, through ctest), so the
  # other seven could rot with nothing to say so -- and one had:
  # examples/csharp/Program.cs called `ex.Balances()`, a method the C# binding
  # has never had, and it sat in the tree until CodeQL was taught to build it.
  #
  # Syntax-checking is not enough for that class of defect: `Balances()` is
  # perfectly valid C# syntax. The compiled examples are therefore actually
  # compiled against the binding in this tree, which is what makes a missing
  # method fail. examples/rust is left out on purpose -- it is a workspace
  # member and the `test` job already builds it.
  examples-smoke:
    name: Examples (build + parse)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          use-public-rspm: true

      # Go and C# link the C ABI; Java loads it through FFM. One build serves all
      # three.
      - name: Build the C ABI library
        run: cargo build -p wickra-exchange-c --release

      # The Rust examples are workspace members, so `cargo test --workspace`
      # compiles them -- and nothing ran them, which meant the assertions
      # inside were never executed. These two are offline and deterministic:
      # `ticker` is excluded because it opens a socket to a live venue.
      - name: Rust examples — run the offline ones
        run: |
          cargo run -p wickra-exchange-examples --bin paper_trade
          cargo run -p wickra-exchange-examples --bin reconcile_after_reconnect

      - name: Node example — syntax check
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for f in examples/node/*.js; do
            echo "node --check $f"
            node --check "$f"
            count=$((count + 1))
          done
          echo "checked $count Node file(s)"

      - name: Python example — byte-compile
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for f in examples/python/*.py; do
            echo "py_compile $f"
            python -m py_compile "$f"
            count=$((count + 1))
          done
          echo "compiled $count Python file(s)"

      # R has no compiler, so parse() is the equivalent: it catches a syntax
      # error but not a call to a function the package does not export. The
      # binding surface itself is held to the trait contract by
      # scripts/check_binding_surface.py in the binding-surface job.
      - name: R example — parse
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for f in examples/r/*.R; do
            echo "parse $f"
            Rscript -e "invisible(parse('$f'))"
            count=$((count + 1))
          done
          echo "parsed $count R file(s)"

      # The one that matters: this compiles against the binding project, so a
      # method the binding does not have fails here rather than in a reader's
      # editor.
      - name: C# example — build
        run: dotnet build examples/csharp/PaperTrade.csproj -c Release

      # The example is written to be run from a module that requires the
      # published Go module, which does not exist until a release. A throwaway
      # module with a `replace` onto bindings/go compiles the same code against
      # the tree.
      - name: Go example — vet against the binding in this tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bindings/go/lib/linux_amd64
          cp target/release/libwickra_exchange.so bindings/go/lib/linux_amd64/
          work=$(mktemp -d)
          cp examples/go/*.go "$work/"
          cd "$work"
          # `go mod init`/`edit` rather than writing the file: inside a YAML
          # block scalar a heredoc body keeps its indentation, and an indented
          # go.mod is not a go.mod.
          go mod init wickraexchangeexamples
          go mod edit -require "github.com/wickra-lib/wickra-exchange-go@v0.0.0"
          go mod edit -replace "github.com/wickra-lib/wickra-exchange-go=$GITHUB_WORKSPACE/bindings/go"
          go mod tidy
          go vet ./...
          echo "go example vets against the binding in this tree"

      # javac against the binding jar: same reasoning as C#. -DskipTests because
      # compiling is the point, not exercising.
      - name: Java example — compile against the binding jar
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -q -f bindings/java package -DskipTests
          jar=$(find bindings/java/target -maxdepth 1 -name '*.jar' \
                ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
          if [ -z "$jar" ]; then
            echo "::error::no binding jar was produced"
            exit 1
          fi
          echo "compiling against $jar"
          javac -cp "$jar" -d "$(mktemp -d)" examples/java/*.java
          echo "java example compiles against the binding in this tree"

  # The Linux wheels are the two artefacts CI never touched: the python job
  # builds a wheel for the runner's own glibc, while release.yml builds
  # manylinux and musllinux wheels inside containers -- and the first time
  # anyone found out whether those build was the tag, which is irreversible.
  #
  # This repository is not exposed to the vendored-OpenSSL trap that makes the
  # equivalent job in `wickra` slow: reqwest and tokio-tungstenite are pinned to
  # rustls with default features off, so there is no system TLS to compile. What
  # is worth proving is the other half, which `wickra`'s job does not: that the
  # wheel a container produces actually installs and imports under that libc.
  # Building a wheel and importing it are different claims.
  python-wheel-container-smoke:
    name: Python wheel (${{ matrix.manylinux }} smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    strategy:
      fail-fast: false
      matrix:
        include:
          - manylinux: auto
            image: quay.io/pypa/manylinux_2_28_x86_64
            python: /opt/python/cp312-cp312/bin/python
          - manylinux: musllinux_1_2
            image: quay.io/pypa/musllinux_1_2_x86_64
            python: /opt/python/cp312-cp312/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync root README into bindings/python so the build matches release
        run: cp README.md bindings/python/README.md

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: x86_64
          # Keep in sync with release.yml.
          args: --release --strip --out dist
          manylinux: ${{ matrix.manylinux }}

      - name: Install and import the wheel under the target libc
        env:
          IMAGE: ${{ matrix.image }}
          PY: ${{ matrix.python }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lh bindings/python/dist/
          # Run inside the same libc the wheel was built for: a musllinux wheel
          # cannot be installed on the glibc runner, so importing it here would
          # prove nothing.
          docker run --rm -v "$PWD/bindings/python/dist:/dist:ro" "$IMAGE"             "$PY" -c "
          import glob, subprocess, sys
          wheels = glob.glob('/dist/*.whl')
          assert wheels, 'no wheel was produced'
          print('installing', wheels[0])
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-index', wheels[0]])
          import wickra_exchange as wx
          ex = wx.Exchange.paper({'USDT': 100000.0})
          assert ex.name() == 'paper', ex.name()
          print('imported and constructed a paper exchange:', wx.__version__)
          "

  binding-surface:
    name: Binding surface parity
    runs-on: ubuntu-latest
    timeout-minutes: 10 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each binding is written separately and tested separately, so a method
      # missing from one of them fails nowhere -- nothing compared the bindings
      # to each other. The first run of this found that the R binding had no
      # `wkex_connect`: an R user could open the derivatives and user-data
      # handles against a live venue and never construct a plain exchange.
      - name: Compare every binding's surface with the Rust traits
        run: python3 scripts/check_binding_surface.py

      # The version lives in twenty-odd declarations across six package
      # managers. A bump that misses one ships a package pinning a binary that
      # was never published, and that surfaces on a user's machine after the
      # tag, which is irreversible.
      - name: Every version declaration agrees
        run: python3 scripts/check_version_sync.py

      # Each bindings/*/README.md is, or is a workflow line away from being, a
      # published package's long description: PyPI renders the Python one, NuGet
      # the C# one, pkg.go.dev the Go one. A link that leaves the package is
      # dead there while resolving fine on GitHub, so nothing says so.
      - name: Binding READMEs link only to what travels with them
        run: python3 scripts/check_readme_links.py

      # An SPDX expression in a manifest is a reference to two documents, not
      # the documents. cargo decides what to package from git, so the copies
      # have to be committed -- and committed copies drift.
      - name: Every published package carries its licence texts
        run: python3 scripts/check_license_copies.py

      # src/Makevars takes the header and library from WKEX_INC / WKEX_LIB,
      # supplied from outside, so nothing in the R job proves the wrapper's
      # calls match the header it is handed -- CI points both at the tree, where
      # they agree by construction.
      - name: The R wrapper matches the C ABI in this tree
        run: python3 scripts/check_r_abi_skew.py

  supply-chain:
    name: Supply-chain (cargo-deny + osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      # osv-scanner.toml existed and nothing ran it. A waiver recorded there was
      # load-bearing for nobody, because no workflow ever consulted the file --
      # it only had an effect if OpenSSF Scorecard happened to read it out of
      # band.
      #
      # cargo-deny above covers the Rust graph only. This covers the other six
      # ecosystems -- npm, PyPI, Maven, NuGet, Go modules, R -- which had no
      # vulnerability scanning in CI at all.
      #
      # --no-resolve turns off transitive resolution of *manifests*. The default
      # enricher resolves each pom.xml against Maven Central, and org.wickra
      # artefacts do not exist there until a release publishes them -- so a
      # version bump would make this job fail on a lookup for the very artefact
      # the bump exists to create. A check that goes red for a reason other than
      # the one it checks teaches people to ignore it. Nothing is lost: every
      # lockfile -- Cargo.lock, package-lock.json, go.mod -- is still scanned in
      # full and transitively, because a lockfile needs no resolution.
      # The two --lockfile arguments are not redundant with --recursive.
      # OSV-Scanner discovers lockfiles by *filename*, and neither
      # ci-dev-py3.txt nor ci-dev-py39.txt matches a pattern it recognises, so
      # the recursive walk skipped both: the first run of this job listed seven
      # scanned files and neither was among them. They are named after the
      # interpreter they target rather than after the format, which is the right
      # name for a reader and the wrong one for the scanner, so the format is
      # stated explicitly instead of renaming the files.
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            --no-resolve
            --config=osv-scanner.toml
            --lockfile=requirements.txt:.github/requirements/ci-dev-py3.txt
            --lockfile=requirements.txt:.github/requirements/ci-dev-py39.txt
            ./

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Hash-pinned rather than `pip install maturin pytest`: an unpinned
      # install resolves whatever the index serves that minute, so a CI run can
      # differ from the one before it for reasons nothing records. Locked twice
      # because a lock is resolved against one interpreter version and 3.9 is at
      # the end of its life. Regenerate with scripts/update-lockfiles.sh.
      - name: Install pinned Python tooling
        shell: bash
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py39.txt
          else
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py3.txt
          fi
      - run: maturin build --out dist
        working-directory: bindings/python
      - run: pip install --no-index --find-links bindings/python/dist wickra-exchange
      - run: pytest bindings/python/tests -q

  go:
    name: Go on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The binding links against the C ABI hub via cgo; build it first and stage
      # the platform library under bindings/go/lib so cgo's LDFLAGS find it.
      - name: Build the C ABI library
        run: cargo build -p wickra-exchange-c --release

      - name: Vendored header in sync with the C ABI
        shell: bash
        # bindings/go/include/wickra_exchange.h is a committed copy of the C ABI
        # header (the parent ../c/include is outside the Go module, so it must be
        # vendored). Fail if it drifts from the source of truth.
        run: |
          if ! diff -u bindings/c/include/wickra_exchange.h bindings/go/include/wickra_exchange.h; then
            echo "::error::bindings/go/include/wickra_exchange.h is stale — copy bindings/c/include/wickra_exchange.h over it"
            exit 1
          fi

      - name: Stage the native library
        shell: bash
        # Stage into lib/<goos>_<goarch>/ to match the per-platform cgo LDFLAGS.
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::unsupported RUNNER_ARCH '$RUNNER_ARCH'"; exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux)   dir="linux_$arch";   lib=target/release/libwickra_exchange.so ;;
            macOS)   dir="darwin_$arch";  lib=target/release/libwickra_exchange.dylib ;;
            Windows) dir="windows_$arch"; lib=target/release/wickra_exchange.dll ;;
          esac
          mkdir -p "bindings/go/lib/$dir"
          cp "$lib" "bindings/go/lib/$dir/"
          echo "WICKRA_GO_LIBDIR=$PWD/bindings/go/lib/$dir" >> "$GITHUB_ENV"

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l bindings/go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet and test the Go binding
        shell: bash
        # On Windows there is no rpath; the loader resolves wickra_exchange.dll via
        # PATH (WICKRA_GO_LIBDIR is the per-platform staged lib dir). Linux/macOS
        # use the rpath baked by the per-platform cgo LDFLAGS.
        run: |
          export PATH="$WICKRA_GO_LIBDIR:$PATH"
          cd bindings/go
          go vet ./...
          go test ./...

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (with wasm target)
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install wasm-pack
        # The taiki-e prebuilt installer, as for cbindgen and cargo-codspeed.
        # jetli/wasm-pack-action with no `version:` installs a ~0.10 wasm-pack
        # whose `build` does not accept `--features`, which this build needs.
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: wasm-pack

      - name: Build the browser package
        run: wasm-pack build bindings/wasm --target web --release --features panic-hook

      - name: Verify the generated artefacts
        # wasm-pack reports success even when a rename upstream leaves the
        # loader pointing at a file it did not emit; name the three files a
        # consumer actually imports.
        run: |
          test -f bindings/wasm/pkg/wickra_exchange_wasm.js
          test -f bindings/wasm/pkg/wickra_exchange_wasm_bg.wasm
          test -f bindings/wasm/pkg/wickra_exchange_wasm.d.ts

      - name: Build the nodejs package for the test suite
        run: wasm-pack build bindings/wasm --target nodejs --release --out-dir pkg

      # Through the generated JS glue rather than through wasm-bindgen-test:
      # the glue is what a consumer imports and what silently changes shape
      # (a HashMap arriving as a JS Map rather than an object, say), so it is
      # the layer worth testing.
      #
      # The glob rather than the bare directory: Node resolves a directory
      # argument as a module path and fails to load it.
      - name: WASM suite -- golden parity against the committed fixtures
        run: node --test bindings/wasm/tests/*.test.js

  node:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      # npm install (not npm ci): the per-platform optionalDependencies point at
      # native packages that are not published until the first release, so they
      # are absent from the lock file and `npm ci` would reject the tree as out
      # of sync. install treats the missing optional packages as non-fatal.
      - name: Install Node dependencies
        run: cd bindings/node && npm install --no-audit --no-fund
      # --platform puts the target triple into the filename so the loader finds
      # the freshly built binary instead of a per-platform npm subpackage.
      - name: Build native module
        run: cd bindings/node && npx napi build --platform --release
      # index.js and index.d.ts are generated by napi and committed, so consumers
      # get types without a build step -- and nothing compared the committed
      # pair with what napi produces. napi rewrites them only when somebody
      # rebuilds, and a rebuild is not part of committing, so they drift
      # silently. The build above has just regenerated them; if git sees a
      # difference, the committed copies are stale. One OS is enough: the output
      # is platform-independent.
      - name: Check the committed loader is in sync with napi
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- bindings/node/index.js bindings/node/index.d.ts; then
            echo "::error::bindings/node/index.js or index.d.ts is out of sync -- run npm run build in bindings/node and commit the result"
            git --no-pager diff -- bindings/node/index.js bindings/node/index.d.ts
            exit 1
          fi

      - name: Run Node tests
        run: cd bindings/node && node --test

  c-abi:
    name: C ABI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cbindgen
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cbindgen
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-exchange-c --release
      - name: Rust unit tests
        run: cargo test -p wickra-exchange-c
      # The generated header is platform-independent, so checking drift on one OS
      # is enough — and avoids a spurious CRLF/LF diff on the Windows runner.
      - name: Check the committed header is in sync with cbindgen
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cbindgen --config bindings/c/cbindgen.toml --crate wickra-exchange-c --output bindings/c/include/wickra_exchange.h
          if ! git diff --quiet -- bindings/c/include/wickra_exchange.h; then
            echo "::error::bindings/c/include/wickra_exchange.h is out of sync — run cbindgen and commit the result"
            git --no-pager diff -- bindings/c/include/wickra_exchange.h
            exit 1
          fi
      # The real cross-language test: a foreign C consumer links the generated
      # header + the compiled library and runs. If this passes on all three OSes,
      # every C-capable language can link the same way.
      - name: Build and run the C example (CMake + ctest)
        shell: bash
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release
          ctest --test-dir examples/c/build -C Release --output-on-failure

  csharp:
    name: C# on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0"
      # The test project copies the native library next to the test assembly from
      # target/debug (see the <Content> items in the .csproj), so build it in the
      # debug profile here.
      - name: Build the C ABI library
        run: cargo build -p wickra-exchange-c
      - name: Test the C# binding
        run: dotnet test bindings/csharp/WickraExchange.Tests/WickraExchange.Tests.csproj -c Release

  java:
    name: Java on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The binding loads the C ABI hub via the Java FFM API; the pom points
      # java.library.path at target/debug (the <native.lib.dir> property), so
      # build it in the debug profile here. The pom pins bytecode to release 25.
      - name: Build the C ABI library
        run: cargo build -p wickra-exchange-c
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Java info
        run: java -version
      - name: Test the Java binding
        run: mvn -B -f bindings/java test

  r:
    name: R on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    env:
      WKEX_INC: ${{ github.workspace }}/bindings/c/include
      WKEX_LIB: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The package compiles a thin .Call glue layer against the C ABI hub and
      # links -lwickra_exchange from WKEX_LIB; build the library first.
      - name: Build the C ABI library
        run: cargo build -p wickra-exchange-c --release
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install and test the R binding
        shell: bash
        # github.workspace is a backslash path on Windows; configure(.win) (sh)
        # and mingw need forward slashes.
        #
        # Nothing is added to the loader path on purpose. configure stages the
        # C ABI into src/ and install.libs.R bundles it beside the package
        # object, resolved by the rpath configure bakes ($ORIGIN /
        # @loader_path) or, on Windows, by the DLL sitting in the same
        # directory. This job previously exported LD_LIBRARY_PATH /
        # DYLD_LIBRARY_PATH / PATH, which made it pass whether or not the
        # package was self-contained. Without them it passes only if it is,
        # which is the property a user installing this package depends on.
        run: |
          export WKEX_INC="${WKEX_INC//\\//}"
          export WKEX_LIB="${WKEX_LIB//\\//}"
          R CMD INSTALL bindings/r
          Rscript bindings/r/tests/run_tests.R

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (lcov)
        # Only the core is measured: the facade crate holds the thin real-socket
        # transport adapters, which are exercised by gated integration tests, not
        # the offline unit suite.
        run: >
          cargo llvm-cov --all-features
          -p wickra-exchange-core
          --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # An organization-level upload token carries no repository identity,
          # so Codecov cannot route the upload without an explicit slug and
          # falls back to a tokenless upload, which a protected branch rejects.
          slug: ${{ github.repository }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  semver:
    name: Public API (cargo-semver-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: it builds rustdoc JSON for each crate and its baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: cargo-semver-checks

      # The published API is a promise, and the version number says what may
      # change: a patch release must not move the public surface.
      #
      # `check-release` compares against the newest version already on
      # crates.io, and neither crate has ever been published -- both return 404
      # today. Running it now fails on the missing baseline, which says nothing
      # about the code. So the baseline is looked up first and the check is
      # skipped, loudly, until there is something to compare against; from the
      # first release onwards it runs on its own without anyone remembering to
      # enable it.
      #
      # Deliberately not `continue-on-error`: that would hide a real API break
      # later, which is the one thing this job exists to catch.
      #
      # Crates are named explicitly rather than --workspace: the bench and the
      # binding crates are `publish = false`, so they have no baseline and
      # promise nothing.
      - name: Check the published crates
        shell: bash
        run: |
          set -euo pipefail
          published=()
          for crate in wickra-exchange-core wickra-exchange; do
            code=$(curl -sS -o /dev/null -w "%{http_code}"               -H "User-Agent: wickra-exchange-ci"               "https://crates.io/api/v1/crates/$crate")
            if [ "$code" = "200" ]; then
              published+=("-p" "$crate")
            else
              echo "::notice::$crate is not on crates.io yet (HTTP $code); no baseline to compare against"
            fi
          done
          if [ "${#published[@]}" -eq 0 ]; then
            echo "no crate has been published yet -- nothing to compare. This job starts checking by itself once the first release lands."
            exit 0
          fi
          cargo semver-checks check-release "${published[@]}"

  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-fuzz
      - name: Fuzz response_parse (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu response_parse -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz credentials_parse (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu credentials_parse -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz filter_round (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu filter_round -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz ws_frame (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ws_frame -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz orderbook_diff (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu orderbook_diff -- -max_total_time=30
        working-directory: fuzz
