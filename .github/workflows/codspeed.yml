name: CodSpeed

# Performance regressions were the one class of defect nothing here reported.
# bench.yml runs nightly and prints numbers a person has to read, so a slowdown
# is found by somebody re-measuring by hand, weeks after it landed. This
# measures every pull request and says so in a comment on it.
#
# It counts instructions under instrumentation rather than timing wall clock.
# That is what makes a shared runner usable: the number does not move because a
# neighbour VM got busy. It is also why these figures are not the ones in
# BENCHMARKS.md -- those are throughput, this is relative change. Both are true;
# they answer different questions.
on:
  # Deliberately unfiltered on main, unlike the pull_request trigger below.
  #
  # A path filter here was the cause of a run of false regressions. CodSpeed
  # compares a pull request against a measurement of main; when the newest main
  # commit has none it falls back to an older one and says so in a footnote
  # ("No successful run was found on main (<sha>), so <older sha> was used
  # instead"). Everything merged between those two commits then shows up as this
  # pull request's regression. With the filter, main went unmeasured on every
  # merge that touched only bindings, examples or docs -- three in a row at one
  # point -- and `apply_delta` was reported 12% slower on branches whose
  # generated assembly for that function was byte-identical.
  #
  # It was not the machine: the diagnostic step below recorded the same CPU
  # (Intel Xeon 6973P-C, family 6 model 173 stepping 1), the same kernel and the
  # same rustc on both sides of one such comparison.
  #
  # So: measure every commit that lands on main, and the base is always the real
  # one. The cost is one job per merge; the alternative was a gate that cried
  # wolf until people stopped reading it.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/codspeed.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Instruction counts
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: instrumentation is far slower per iteration than a plain run
    permissions:
      contents: read
      # OpenID Connect against CodSpeed, which is what their action recommends
      # over an upload token. A public repository needs no token at all.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: cargo-codspeed

      # This job spent an evening failing every pull request with the same
      # figure: `apply_delta` at 453.6 ns against a 399.4 ns base, on five runs
      # across two branches whose diffs had nothing in common -- and the second
      # of those branches touched neither `orderbook.rs` nor the bench crate.
      # Meanwhile main kept reporting 399.4 while already carrying the code the
      # first branch had "regressed" on.
      #
      # It was never a real regression, and that part is settled rather than
      # assumed: building both revisions with `--emit=asm` and comparing the two
      # functions the benchmark executes shows `apply_delta` identical modulo
      # basic-block label numbering, and `apply_level` identical but for the
      # names of anonymous panic constants.
      #
      # This step then answered the rest of it on its first pair of runs. The
      # main run and the pull-request run it was compared against reported the
      # same CPU (Intel Xeon 6973P-C, family 6 model 173 stepping 1), the same
      # kernel (6.17.0-1022-azure) and the same rustc 1.98.0 -- so CodSpeed's
      # "Different runtime environments detected" was not about the machine, and
      # what remained was its own footnote: it had fallen back to an older base
      # commit because the newest main commit had never been measured. The path
      # filter that caused that is gone from the push trigger above.
      #
      # The step stays because the answer took an evening to reach and the next
      # occurrence should take one run: it records the CPU, kernel and toolchain
      # of whatever machine produced a number. A diagnostic must never fail the
      # job, hence the fallback and the trailing `|| true`.
      #
      # It earned itself on the next occurrence, which took one run and had the
      # opposite answer: that time it *was* the machine. `apply_delta` came back
      # at exactly 453.6 ns against exactly 399.4 ns -- the same pair as above,
      # to the decimal -- on a pull request whose only non-comment Rust change
      # was one name removed from a re-export list and one `pub` narrowed to
      # `pub(crate)` on a test-only mock. The base was measured on the newest
      # main commit this time, so the fallback that explained the first
      # occurrence was ruled out. What differed was the CPU:
      #
      #   base (main)     AMD EPYC 7763 64-Core, family 25 model 1   399.4 ns
      #   head (the PR)   AMD EPYC 9V74 80-Core, family 25 model 17  453.6 ns
      #
      # Same kernel, same rustc, same LLVM. `simulation` mode counts
      # instructions, but the nanosecond figure CodSpeed reports is modelled
      # from them, and the model is fitted to the host's cache geometry --
      # which differs between Milan and Genoa. GitHub's ubuntu-latest pool
      # holds both, so the reported figure is bimodal per runner while the
      # instruction stream is unchanged.
      #
      # There is no fix available here: a standard runner cannot be pinned to a
      # CPU generation, and a threshold wide enough to swallow 12% would swallow
      # a real 12% regression too. So this check is read, not obeyed: when it
      # fires, compare the two CPU lines below before looking at the diff. If
      # they differ and the diff cannot reach the benchmarked function, it is
      # this, and the two figures will be that same pair again.
      - name: Record the measurement environment
        # `github.ref` reaches the shell through the environment, not through
        # template expansion: on a push it carries a branch name, and a branch
        # name is attacker-controllable text that `${{ }}` would paste straight
        # into the script (zizmor template-injection).
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "event=${EVENT_NAME} ref=${REF}"
          echo "runner=${RUNNER_NAME:-?} arch=${RUNNER_ARCH:-?} os=${RUNNER_OS:-?}"
          echo "--- cpu ---"
          lscpu 2>/dev/null | grep -E 'Model name|CPU family|Model:|Stepping|CPU MHz' \
            || grep -E 'model name|cpu family|stepping' /proc/cpuinfo | sort -u \
            || true
          echo "--- kernel / toolchain ---"
          uname -srm
          rustc --version --verbose

      # The bench crate depends on codspeed-criterion-compat aliased to
      # `criterion`. Without that alias these steps succeed and report nothing,
      # which is the failure mode worth naming: a green job that measured
      # nothing looks exactly like a green job that found no regression.
      - name: Build the benchmarks
        run: cargo codspeed build -p wickra-exchange-bench

      - name: Run them under instrumentation
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          # Required since action v4, and it used to be inferred. `simulation`
          # counts instructions under instrumentation; `walltime` measures real
          # time and needs CodSpeed's dedicated macro runners, which a standard
          # GitHub runner is not -- there the timing would be as noisy as any
          # other shared VM, which is the noise this job exists to avoid.
          mode: simulation
          run: cargo codspeed run -p wickra-exchange-bench
