name: CodSpeed

# Performance regressions were the one class of defect nothing here reported.
# bench.yml runs nightly and prints numbers a person has to read, so a slowdown
# is found by somebody re-measuring by hand, weeks after it landed. This
# measures every pull request and says so in a comment on it.
#
# It counts instructions under instrumentation rather than timing wall clock.
# That is what makes a shared runner usable: the number does not move because a
# neighbour VM got busy. It is also why these figures are not the ones in
# BENCHMARKS.md -- those are throughput, this is relative change. Both are true;
# they answer different questions.
on:
  push:
    branches: [main]
    paths:
      ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/codspeed.yml"]
  pull_request:
    branches: [main]
    paths:
      ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/codspeed.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Instruction counts
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: instrumentation is far slower per iteration than a plain run
    permissions:
      contents: read
      # OpenID Connect against CodSpeed, which is what their action recommends
      # over an upload token. A public repository needs no token at all.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: cargo-codspeed

      # This job spent an evening failing every pull request with the same
      # figure: `apply_delta` at 453.6 ns against a 399.4 ns base, on five runs
      # across two branches whose diffs had nothing in common -- and the second
      # of those branches touched neither `orderbook.rs` nor the bench crate.
      # Meanwhile main kept reporting 399.4 while already carrying the code the
      # first branch had "regressed" on.
      #
      # It was never a real regression, and that part is settled rather than
      # assumed: building both revisions with `--emit=asm` and comparing the two
      # functions the benchmark executes shows `apply_delta` identical modulo
      # basic-block label numbering, and `apply_level` identical but for the
      # names of anonymous panic constants.
      #
      # The offset then disappeared on its own, once main was measured again on
      # a later commit -- base and head have agreed since. So the cause was in
      # the comparison rather than in the source, but which part of it is not
      # established: CodSpeed reported "Different runtime environments detected"
      # without naming the dimension, and separately fell back to an unexpected
      # base commit at one point.
      #
      # This step exists so a recurrence is diagnosable instead of re-derived
      # from scratch: it records the CPU, kernel and toolchain of whatever
      # machine produced the number. A diagnostic must never fail the job, hence
      # the fallback and the trailing `|| true`.
      - name: Record the measurement environment
        # `github.ref` reaches the shell through the environment, not through
        # template expansion: on a push it carries a branch name, and a branch
        # name is attacker-controllable text that `${{ }}` would paste straight
        # into the script (zizmor template-injection).
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "event=${EVENT_NAME} ref=${REF}"
          echo "runner=${RUNNER_NAME:-?} arch=${RUNNER_ARCH:-?} os=${RUNNER_OS:-?}"
          echo "--- cpu ---"
          lscpu 2>/dev/null | grep -E 'Model name|CPU family|Model:|Stepping|CPU MHz' \
            || grep -E 'model name|cpu family|stepping' /proc/cpuinfo | sort -u \
            || true
          echo "--- kernel / toolchain ---"
          uname -srm
          rustc --version --verbose

      # The bench crate depends on codspeed-criterion-compat aliased to
      # `criterion`. Without that alias these steps succeed and report nothing,
      # which is the failure mode worth naming: a green job that measured
      # nothing looks exactly like a green job that found no regression.
      - name: Build the benchmarks
        run: cargo codspeed build -p wickra-exchange-bench

      - name: Run them under instrumentation
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          # Required since action v4, and it used to be inferred. `simulation`
          # counts instructions under instrumentation; `walltime` measures real
          # time and needs CodSpeed's dedicated macro runners, which a standard
          # GitHub runner is not -- there the timing would be as noisy as any
          # other shared VM, which is the noise this job exists to avoid.
          mode: simulation
          run: cargo codspeed run -p wickra-exchange-bench
