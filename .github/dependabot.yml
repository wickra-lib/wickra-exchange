version: 2
updates:
  # Rust workspace (root Cargo.toml + all member crates).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo)"
    # base64 must stay on the 0.22 line. reqwest pulls 0.22 in through
    # hyper-util/hyper-rustls, so declaring 0.23 here compiles a second copy of
    # the crate into every artefact -- which is what #156 removed. Dependabot
    # proposed 0.23 again on its next rebase and reverted the declaration, so
    # the constraint is recorded here rather than re-fixed every month. Lift it
    # when reqwest itself moves to 0.23 and a single version resolves again.
    ignore:
      - dependency-name: "base64"
        versions: [">= 0.23"]
    groups:
      # napi-rs (napi / napi-derive / napi-build) is a coordinated major
      # migration that must move with @napi-rs/cli on the npm side — keep it in
      # its own PR rather than bundled with unrelated crate bumps.
      napi:
        patterns: ["napi", "napi-derive", "napi-build"]
      cargo:
        patterns: ["*"]
        exclude-patterns: ["napi", "napi-derive", "napi-build"]

  # Fuzz targets (their own detached workspace, built on nightly by cargo-fuzz).
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo-fuzz)"
    # A second cargo entry does not inherit the root entry's ignores, and the
    # fuzz crate depends on wickra-exchange-core by `path` -- so a proposal that
    # arrives titled "/fuzz" can change the main tree. base64 is repeated here
    # for that reason: without it this entry would re-propose the 0.23 line the
    # root entry blocks, and compile a second copy of the crate again (#156).
    ignore:
      - dependency-name: "base64"
        versions: [">= 0.23"]
    groups:
      cargo-fuzz:
        patterns: ["*"]

  # CI's own Python tooling (.github/requirements/*.txt), hash-pinned.
  # A separate entry from the binding's pip manifest: these are the versions CI
  # runs with, and they move on their own schedule.
  - package-ecosystem: pip
    directory: "/.github/requirements"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(ci-python)"
    groups:
      ci-python:
        patterns: ["*"]

  # Node binding npm dependencies.
  - package-ecosystem: npm
    directory: "/bindings/node"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    groups:
      node-binding:
        patterns: ["*"]

  # Python binding pip dependencies.
  - package-ecosystem: pip
    directory: "/bindings/python"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(pip)"
    groups:
      python-binding:
        patterns: ["*"]

  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot reads
  # the version comment after each pinned SHA and bumps both together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    # dtolnay/rust-toolchain@<channel> pins a Rust toolchain (e.g. 1.86 for the
    # MSRV job, 1.88 for the Node binding), not an action version. Dependabot
    # misreads the channel as a version and proposes non-existent Rust releases
    # (e.g. 1.100). The toolchain pins are managed manually with the MSRV policy.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns: ["*"]

  # Java binding (Maven) — tracks the C-ABI binding's build/publishing plugins.
  - package-ecosystem: maven
    directory: "/bindings/java"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(maven)"
    groups:
      maven:
        patterns: ["*"]

  # C# binding (NuGet). The published WickraExchange.csproj is a thin C-ABI
  # wrapper with no external packages; the test project pulls xunit and
  # Microsoft.NET.Test.Sdk.
  - package-ecosystem: nuget
    directory: "/bindings/csharp/WickraExchange.Tests"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(nuget)"
    groups:
      nuget:
        patterns: ["*"]

  # Go binding (Go modules). The binding's own go.mod has no external deps but
  # Dependabot keeps the toolchain/directive current.
  - package-ecosystem: gomod
    directory: "/bindings/go"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(gomod)"
    groups:
      go-binding:
        patterns: ["*"]
