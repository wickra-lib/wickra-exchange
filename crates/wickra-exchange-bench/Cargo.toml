[package]
name = "wickra-exchange-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Internal throughput benchmarks for wickra-exchange (not published)."

[lints]
workspace = true

[dev-dependencies]
wickra-exchange-core = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde_json = { workspace = true }
# CodSpeed's drop-in replacement, pulled in under the name `criterion` so the
# benches keep their `use criterion::{...}` and not a line of throughput.rs has
# to change. Off a CodSpeed runner it behaves exactly as criterion does, so
# `cargo bench -p wickra-exchange-bench` locally is unaffected.
#
# Without the alias the benches still build and still run -- and report
# nothing. That failure is silent, which is why it is spelled out here.
criterion = { package = "codspeed-criterion-compat", version = "5.0.1", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false
